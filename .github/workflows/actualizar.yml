name: Actualizar calendario

on:
  schedule:
    - cron: "17 5 * * *"   # cada dia a las 05:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["calendario.py", ".github/workflows/actualizar.yml", "docs/index.html"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: calendario
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generar el .ics desde la web oficial
        run: python -I calendario.py

      - name: Guardar estado e historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json docs/optcg-europa.ics
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore: actualizar calendario $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: despliegue
        uses: actions/deploy-pages@v4
