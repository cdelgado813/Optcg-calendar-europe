# Worker que sirve los calendarios en calendar.poordevelopers.com.
# El dominio lo crea wrangler al desplegar (registro DNS + certificado), sin Terraform:
#   cd worker && npx wrangler deploy
name = "poordev-wrkr-cal-1-pro"
main = "src/index.js"
compatibility_date = "2026-11-01"
workers_dev = false

routes = [
  { pattern = "calendar.poordevelopers.com", custom_domain = true }
]
